<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DIARY - OSHAKE</title>

    <link rel="stylesheet" href="../css/diary.css">

    <style>
        .diary-main {
            width: min(1000px, calc(100% - 40px));
            margin: 0 auto;
            padding: 150px 0 100px;
        }

        .diary-title {
            margin: 0;
            font-family: "Kaushan Script", cursive;
            font-size: 70px;
            line-height: 1.2;
        }

        .diary-header-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 40px;
        }

        .new-diary-button {
            display: inline-block;
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            text-decoration: none;
            font-family: "Kaushan Script", cursive;
            font-size: 18px;
            transition: background 0.2s ease;
        }

        .new-diary-button:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .diary-card {
            display: block;
            padding: 25px 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.025);
            color: #ffffff;
            text-decoration: none;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .diary-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateX(5px);
        }

        .diary-card-title {
            margin: 0;
            font-family: "Kaushan Script", cursive;
            font-size: 30px;
            line-height: 1.4;
        }

        .diary-card-date {
            margin-top: 8px;
            font-size: 13px;
            opacity: 0.5;
        }

        .diary-card-preview {
            margin-top: 15px;
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.7;
            overflow: hidden;
        }

        .diary-card-preview img {
            max-width: 100%;
            height: auto;
        }

        .diary-login {
            margin-top: 60px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.025);
        }

        .diary-login-title {
            margin: 0 0 20px;
            font-family: "Kaushan Script", cursive;
            font-size: 25px;
        }

        .diary-login-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .diary-login-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
        }

        .diary-login-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .diary-login-input:focus {
            border-color: rgba(255, 255, 255, 0.7);
        }

        .diary-login-button,
        .diary-logout-button {
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-family: "Kaushan Script", cursive;
            cursor: pointer;
        }

        .diary-login-button:hover,
        .diary-logout-button:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .diary-login-button:disabled,
        .diary-logout-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .diary-auth-status {
            margin-top: 15px;
            opacity: 0.7;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .diary-empty {
            padding: 50px 20px;
            text-align: center;
            opacity: 0.5;
        }

        #diary-message {
            margin-top: 30px;
            min-height: 25px;
            opacity: 0.7;
        }

        @media (max-width: 800px) {

            .diary-main {
                width: calc(100% - 30px);
                padding-top: 120px;
            }

            .diary-title {
                font-size: 48px;
            }

            .diary-header-area {
                align-items: flex-start;
                flex-direction: column;
            }

            .diary-card {
                padding: 20px;
            }

            .diary-card-title {
                font-size: 25px;
            }

        }
    </style>

</head>

<body>

    <canvas id="night-sky"></canvas>

    <header class="diary-header">

        <a href="../index.html" class="diary-logo">
            OSHAKE
        </a>

    </header>

    <main class="diary-main">

        <div class="diary-header-area">

            <h1 class="diary-title">
                DIARY
            </h1>

            <a id="new-diary-button" class="new-diary-button" href="editor.html" style="display: none;">
                NEW DIARY
            </a>

        </div>

        <div id="diary-list" class="diary-list"></div>

        <p id="diary-message"></p>

        <section id="diary-login" class="diary-login">

            <h2 class="diary-login-title">
                OWNER LOGIN
            </h2>

            <form id="diary-login-form" class="diary-login-form">

                <input id="diary-email" class="diary-login-input" type="email" placeholder="EMAIL" autocomplete="email"
                    required>

                <input id="diary-password" class="diary-login-input" type="password" placeholder="PASSWORD"
                    autocomplete="current-password" required>

                <button id="diary-login-button" class="diary-login-button" type="submit">
                    LOGIN
                </button>

            </form>

            <div id="diary-auth-status" class="diary-auth-status"></div>

            <button id="diary-logout-button" class="diary-logout-button" type="button" style="display: none;">
                LOGOUT
            </button>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="../js/night-sky.js"></script>
    <script src="../js/diary/supabase.js"></script>
    <script src="../js/diary/markdown.js"></script>
    <script src="../js/diary/diary.js"></script>

</body>

</html>
