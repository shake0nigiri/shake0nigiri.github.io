<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEW DIARY - OSHAKE</title>

    <link rel="stylesheet" href="../css/diary.css">

    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

    <style>
        .editor-main {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: 150px 0 120px;
        }

        .editor-back {
            display: inline-block;
            margin-bottom: 40px;
            color: #fff;
            text-decoration: none;
            font-family: "Kaushan Script", cursive;
            font-size: 18px;
            opacity: 0.7;
        }

        .editor-back:hover {
            opacity: 1;
        }

        .editor-title {
            margin: 0 0 45px;
            font-family: "Kaushan Script", cursive;
            font-size: 60px;
            line-height: 1.2;
        }

        .editor-form {
            display: block;
            width: 100%;
        }

        .editor-field {
            display: block;
            width: 100%;
            margin-bottom: 30px;
        }

        .editor-label {
            display: block;
            margin-bottom: 10px;
            font-family: "Kaushan Script", cursive;
            font-size: 20px;
            opacity: 0.8;
        }

        .editor-input {
            display: block;
            box-sizing: border-box;
            width: 100%;
            height: 55px;
            padding: 0 15px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            background: rgba(255, 255, 255, 0.04);

            color: #fff;

            outline: none;

            font-family: inherit;
            font-size: 18px;
        }

        .editor-input:focus {
            border-color: rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.06);
        }

        /* =========================
           EDITOR AREA
        ========================= */

        .editor-workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

            align-items: start;

            gap: 25px;

            width: 100%;

            margin-top: 30px;
        }

        .editor-panel {
            display: block;

            width: 100%;

            min-width: 0;

            position: relative;
        }

        .editor-panel-title {
            display: block;

            margin-bottom: 10px;

            font-family: "Kaushan Script", cursive;
            font-size: 20px;

            opacity: 0.8;
        }

        /* =========================
           QUILL TOOLBAR
        ========================= */

        #toolbar {
            display: block;

            position: relative;
            z-index: 10;

            width: 100%;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            background:
                rgba(255, 255, 255, 0.035);
        }

        .ql-toolbar.ql-snow {
            box-sizing: border-box;

            width: 100%;

            border: 0;

            background:
                rgba(255, 255, 255, 0.035);
        }

        /* =========================
           QUILL EDITOR
        ========================= */

        #editor {
            display: block;

            position: relative;
            z-index: 1;

            box-sizing: border-box;

            width: 100%;

            /*
             * ここを固定する。
             * min-heightではなくheightを使う。
             */
            height: 500px !important;

            min-height: 500px !important;

            margin: 0;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            border-top: 0;

            background:
                rgba(255, 255, 255, 0.035);

            color: #fff;

            font-family: inherit;

            font-size: 16px;

            line-height: 1.8;

            overflow: hidden;
        }

        /*
         * Quillが自動生成するコンテナ。
         * ここにも明示的に500pxを指定する。
         */
        #editor.ql-container.ql-snow {
            display: block;

            box-sizing: border-box;

            width: 100%;

            height: 500px !important;

            min-height: 500px !important;

            margin: 0;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            border-top: 0;

            overflow: hidden;
        }

        /*
         * 実際に文字を入力する場所
         */
        #editor .ql-editor {
            box-sizing: border-box;

            display: block;

            width: 100%;

            height: 500px !important;

            min-height: 500px !important;

            padding: 20px;

            overflow-y: auto;

            overflow-x: hidden;

            color: #fff;
        }

        #editor .ql-editor.ql-blank::before {
            color:
                rgba(255, 255, 255, 0.35);

            font-style: normal;
        }

        /* =========================
           QUILL COLORS
        ========================= */

        .ql-snow .ql-stroke {
            stroke:
                rgba(255, 255, 255, 0.8);
        }

        .ql-snow .ql-fill {
            fill:
                rgba(255, 255, 255, 0.8);
        }

        .ql-snow .ql-picker {
            color:
                rgba(255, 255, 255, 0.8);
        }

        .ql-snow .ql-picker-options {
            background:
                #181818;

            border-color:
                rgba(255, 255, 255, 0.2);
        }

        .ql-snow .ql-picker-item {
            color:
                #fff;
        }

        .ql-snow .ql-picker-label {
            color:
                rgba(255, 255, 255, 0.8);
        }

        .ql-snow button:hover .ql-stroke,
        .ql-snow .ql-picker-label:hover .ql-stroke,
        .ql-snow .ql-picker-item:hover .ql-stroke {
            stroke:
                #fff;
        }

        .ql-snow button:hover .ql-fill,
        .ql-snow .ql-picker-label:hover .ql-fill,
        .ql-snow .ql-picker-item:hover .ql-fill {
            fill:
                #fff;
        }

        .ql-snow .ql-tooltip {
            background:
                #181818;

            border:
                1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                none;

            color:
                #fff;

            z-index:
                100;
        }

        .ql-snow .ql-tooltip input[type="text"] {
            background:
                #111;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            color:
                #fff;
        }

        /* =========================
           PREVIEW
        ========================= */

        .markdown-preview {
            display: block;

            box-sizing: border-box;

            width: 100%;

            height: 500px;

            min-height: 500px;

            padding: 20px;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            background:
                rgba(255, 255, 255, 0.03);

            line-height: 1.9;

            overflow-x: hidden;
            overflow-y: auto;

            overflow-wrap: anywhere;
        }

        .markdown-preview h1,
        .markdown-preview h2,
        .markdown-preview h3,
        .markdown-preview h4,
        .markdown-preview h5,
        .markdown-preview h6 {
            font-family:
                "Kaushan Script",
                cursive;

            line-height:
                1.4;

            margin:
                35px 0 15px;
        }

        .markdown-preview h1 {
            font-size: 38px;
        }

        .markdown-preview h2 {
            font-size: 32px;
        }

        .markdown-preview h3 {
            font-size: 27px;
        }

        .markdown-preview h4 {
            font-size: 23px;
        }

        .markdown-preview h5 {
            font-size: 20px;
        }

        .markdown-preview h6 {
            font-size: 18px;
        }

        .markdown-preview blockquote {
            margin:
                20px 0;

            padding:
                10px 18px;

            border-left:
                3px solid rgba(255, 255, 255, 0.5);

            background:
                rgba(255, 255, 255, 0.03);

            opacity:
                0.85;
        }

        .markdown-preview pre {
            padding:
                15px;

            overflow-x:
                auto;

            background:
                rgba(0, 0, 0, 0.35);
        }

        .markdown-preview code {
            padding:
                2px 6px;

            background:
                rgba(255, 255, 255, 0.08);
        }

        .markdown-preview img {
            display:
                block;

            max-width:
                100%;

            height:
                auto;

            margin:
                15px 0;
        }

        .markdown-preview a {
            color:
                #fff;
        }

        /* =========================
           PUBLISH OPTIONS
        ========================= */

        .editor-options {
            position: relative;

            z-index: 20;

            display: flex;

            align-items: center;

            gap: 10px;

            width: 100%;

            margin-top: 30px;

            padding: 0;

            clear: both;
        }

        .editor-options input {
            display: block;

            flex:
                0 0 auto;

            width:
                16px;

            height:
                16px;

            margin:
                0;

            cursor:
                pointer;
        }

        .editor-options label {
            display:
                block;

            cursor:
                pointer;

            user-select:
                none;

            opacity:
                0.8;
        }

        /* =========================
           BUTTONS
        ========================= */

        .editor-buttons {
            position: relative;

            z-index: 20;

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            width: 100%;

            margin-top: 25px;

            clear: both;
        }

        .editor-button {
            position: relative;

            z-index: 21;

            display: block;

            box-sizing: border-box;

            min-width:
                155px;

            height:
                54px;

            margin:
                0;

            padding:
                12px 22px;

            border:
                1px solid rgba(255, 255, 255, 0.25);

            background:
                rgba(255, 255, 255, 0.04);

            color:
                #fff;

            font-family:
                "Kaushan Script",
                cursive;

            font-size:
                18px;

            cursor:
                pointer;
        }

        .editor-button:hover {
            background:
                rgba(255, 255, 255, 0.12);
        }

        .editor-button:disabled {
            opacity:
                0.4;

            cursor:
                default;
        }

        .editor-message {
            position:
                relative;

            z-index:
                20;

            display:
                block;

            width:
                100%;

            min-height:
                24px;

            margin:
                25px 0 0;

            clear:
                both;

            opacity:
                0.7;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .editor-main {
                width:
                    calc(100% - 30px);

                padding-top:
                    120px;
            }

            .editor-title {
                font-size:
                    42px;
            }

            .editor-workspace {
                grid-template-columns:
                    1fr;
            }

            #editor,
            #editor.ql-container.ql-snow {
                height:
                    350px !important;

                min-height:
                    350px !important;
            }

            #editor .ql-editor {
                height:
                    350px !important;

                min-height:
                    350px !important;
            }

            .markdown-preview {
                height:
                    350px;

                min-height:
                    350px;
            }
        }
    </style>
</head>

<body>

    <canvas id="night-sky"></canvas>

    <header class="diary-header">

        <a href="../index.html" class="diary-logo">
            OSHAKE
        </a>

    </header>

    <main class="editor-main">

        <a href="index.html" class="editor-back">
            ← BACK TO DIARY
        </a>

        <h1 id="editor-title" class="editor-title">
            NEW DIARY
        </h1>

        <form id="editor-form" class="editor-form">

            <div class="editor-field">

                <label class="editor-label" for="diary-title">
                    TITLE
                </label>

                <input id="diary-title" class="editor-input" type="text" maxlength="200" autocomplete="off" required>

            </div>

            <div class="editor-workspace">

                <section class="editor-panel">

                    <div class="editor-panel-title">
                        CONTENT
                    </div>

                    <div id="toolbar">

                        <span class="ql-formats">

                            <select class="ql-header">

                                <option value="1"></option>
                                <option value="2"></option>
                                <option value="3"></option>
                                <option value="4"></option>
                                <option value="5"></option>
                                <option value="6"></option>
                                <option selected></option>

                            </select>

                        </span>

                        <span class="ql-formats">

                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                            <button class="ql-strike"></button>

                        </span>

                        <span class="ql-formats">

                            <select class="ql-color"></select>
                            <select class="ql-background"></select>

                        </span>

                        <span class="ql-formats">

                            <button class="ql-list" value="ordered"></button>

                            <button class="ql-list" value="bullet"></button>

                            <button class="ql-blockquote"></button>
                            <button class="ql-code-block"></button>

                        </span>

                        <span class="ql-formats">

                            <select class="ql-align"></select>

                        </span>

                        <span class="ql-formats">

                            <button class="ql-link"></button>
                            <button class="ql-image"></button>

                        </span>

                        <span class="ql-formats">

                            <button class="ql-clean"></button>

                        </span>

                    </div>

                    <div id="editor"></div>

                </section>

                <section class="editor-panel">

                    <div class="editor-panel-title">
                        PREVIEW
                    </div>

                    <div id="markdown-preview" class="markdown-preview"></div>

                </section>

            </div>

            <div class="editor-options">

                <input id="published" type="checkbox">

                <label for="published">
                    公開する
                </label>

            </div>

            <div class="editor-buttons">

                <button id="draft-button" class="editor-button" type="button">
                    SAVE DRAFT
                </button>

                <button id="save-button" class="editor-button" type="submit">
                    PUBLISH
                </button>

            </div>

            <p id="editor-message" class="editor-message"></p>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <script src="../js/night-sky.js"></script>

    <script src="../js/diary/markdown.js"></script>

    <script src="../js/diary/editor.js"></script>

</body>

</html>
