<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEW DIARY - OSHAKE</title>

    <link rel="stylesheet" href="../css/diary.css">

    <style>
        .editor-main {
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            padding: 150px 0 100px;
        }

        .editor-back {
            display: inline-block;
            margin-bottom: 40px;
            color: #fff;
            text-decoration: none;
            font-family: "Kaushan Script", cursive;
            font-size: 18px;
            opacity: 0.7;
        }

        .editor-back:hover {
            opacity: 1;
        }

        .editor-title {
            margin: 0 0 50px;
            font-family: "Kaushan Script", cursive;
            font-size: 60px;
            line-height: 1.2;
        }

        .editor-form {
            width: 100%;
        }

        .editor-field {
            margin-bottom: 25px;
        }

        .editor-label {
            display: block;
            margin-bottom: 10px;
            font-family: "Kaushan Script", cursive;
            font-size: 20px;
            opacity: 0.8;
        }

        .editor-input,
        .editor-textarea {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            font-family: inherit;
        }

        .editor-input {
            height: 55px;
            padding: 0 15px;
            font-size: 18px;
        }

        .editor-textarea {
            min-height: 450px;
            padding: 15px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.8;
        }

        .editor-input:focus,
        .editor-textarea:focus {
            border-color: rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.06);
        }

        .editor-workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        .editor-panel {
            min-width: 0;
        }

        .editor-panel-title {
            margin-bottom: 10px;
            font-family: "Kaushan Script", cursive;
            font-size: 20px;
            opacity: 0.8;
        }

        .markdown-preview {
            box-sizing: border-box;
            min-height: 450px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .markdown-preview h1,
        .markdown-preview h2,
        .markdown-preview h3 {
            font-family: "Kaushan Script", cursive;
            line-height: 1.4;
            margin: 35px 0 15px;
        }

        .markdown-preview h1 {
            font-size: 36px;
        }

        .markdown-preview h2 {
            font-size: 30px;
        }

        .markdown-preview h3 {
            font-size: 24px;
        }

        .markdown-preview blockquote {
            margin: 20px 0;
            padding: 10px 18px;
            border-left: 3px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.03);
            opacity: 0.85;
        }

        .markdown-preview code {
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.08);
        }

        .markdown-preview pre {
            padding: 15px;
            overflow-x: auto;
            background: rgba(0, 0, 0, 0.35);
        }

        .markdown-preview pre code {
            padding: 0;
            background: none;
        }

        .markdown-preview img {
            max-width: 100%;
            height: auto;
        }

        .markdown-preview a {
            color: #fff;
        }

        .editor-options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }

        .editor-options label {
            cursor: pointer;
            user-select: none;
            opacity: 0.8;
        }

        .editor-options input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .editor-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 35px;
        }

        .editor-button {
            min-width: 150px;
            padding: 12px 22px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: "Kaushan Script", cursive;
            font-size: 18px;
            cursor: pointer;
        }

        .editor-button:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .editor-button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .editor-message {
            min-height: 24px;
            margin-top: 25px;
            opacity: 0.7;
        }

        @media (max-width: 800px) {
            .editor-main {
                width: calc(100% - 30px);
                padding-top: 120px;
            }

            .editor-title {
                font-size: 42px;
            }

            .editor-workspace {
                grid-template-columns: 1fr;
            }

            .editor-textarea,
            .markdown-preview {
                min-height: 350px;
            }
        }
    </style>
</head>

<body>

    <canvas id="night-sky"></canvas>

    <header class="diary-header">
        <a href="../index.html" class="diary-logo">
            OSHAKE
        </a>
    </header>

    <main class="editor-main">

        <a href="index.html" class="editor-back">
            ← BACK TO DIARY
        </a>

        <h1 id="editor-title" class="editor-title">
            NEW DIARY
        </h1>

        <form id="editor-form" class="editor-form">

            <div class="editor-field">
                <label class="editor-label" for="diary-title">
                    TITLE
                </label>

                <input id="diary-title" class="editor-input" type="text" maxlength="200" autocomplete="off" required>
            </div>

            <div class="editor-workspace">

                <section class="editor-panel">

                    <div class="editor-panel-title">
                        CONTENT
                    </div>

                    <textarea id="diary-content" class="editor-textarea" placeholder="Markdownで日記を書いてください。"
                        spellcheck="false" required></textarea>

                </section>

                <section class="editor-panel">

                    <div class="editor-panel-title">
                        PREVIEW
                    </div>

                    <div id="markdown-preview" class="markdown-preview"></div>

                </section>

            </div>

            <div class="editor-options">

                <input id="published" type="checkbox">

                <label for="published">
                    公開する
                </label>

            </div>

            <div class="editor-buttons">

                <button id="draft-button" class="editor-button" type="button">
                    SAVE DRAFT
                </button>

                <button id="save-button" class="editor-button" type="submit">
                    PUBLISH
                </button>

            </div>

            <p id="editor-message" class="editor-message"></p>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <script src="../js/night-sky.js"></script>

    <script src="../js/diary/markdown.js"></script>

    <script src="../js/diary/editor.js"></script>

</body>

</html>
