<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OSHAKE</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 夜空 -->
  <canvas id="night-sky"></canvas>

  <!-- ページ切り替え演出 -->
  <div id="page-transition"></div>

  <!-- HEADER -->
  <header class="site-header build-item">
    <a href="index.html" class="site-logo">OSHAKE</a>
    <div class="site-type">ORIGINAL WEBSITE</div>
  </header>


  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <p class="hero-small build-item">
          WELCOME
        </p>

        <h1 class="hero-title build-item">
          OSHAKE
        </h1>

        <p class="hero-subtitle build-item">
          CREATE / PLAY / ENJOY
        </p>

        <div class="hero-card build-item">
          <span>お鮭</span>
        </div>

        <div class="hero-number build-item">
          OSHAKE <span>/ 508</span>
        </div>

      </div>

    </section>


    <!-- PROFILE -->
    <section class="profile-section">

      <div class="section-title build-item">
        PROFILE
      </div>

      <div class="profile-box build-item">

        <p class="description">
          しゃけおにぎりと申します。（別名御鮭）<br>
          見習いドット絵師やってます。<br>
          おしゃけのオリジナルのウェブサイトです。
        </p>

      </div>


      <!-- LINKS -->
      <div class="url-list">

        <!-- DIARY -->
        <a class="url-button build-item" href="diary/index.html" aria-label="DIARY">
          <span class="coming-soon-icon-space"></span>
          <span class="url-title">DIARY</span>
        </a>


        <!-- INSTAGRAM -->
        <a class="url-button social-button hold-link build-item"
          href="https://www.instagram.com/shake.0nigiri?stkn=MTV6MWY0NGR6OXRmbg==" target="_blank"
          rel="noopener noreferrer" aria-label="Instagram">
          <img src="textures/logo/instagram.png" alt="" class="social-icon">
          <span class="url-title">Instagram</span>
          <span class="hold-progress"></span>
        </a>


        <!-- X -->
        <a class="url-button social-button hold-link build-item" href="https://x.com/oshakn_508" target="_blank"
          rel="noopener noreferrer" aria-label="X">
          <img src="textures/logo/x.png" alt="" class="social-icon">
          <span class="url-title">X</span>
          <span class="hold-progress"></span>
        </a>


        <!-- YOUTUBE -->
        <a class="url-button social-button hold-link build-item" href="https://www.youtube.com/@oshake-508"
          target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <img src="textures/logo/youtube.png" alt="" class="social-icon">
          <span class="url-title">YouTube</span>
          <span class="hold-progress"></span>
        </a>


        <!-- COMING SOON -->
        <button class="url-button coming-soon-button build-item" type="button">
          <span class="coming-soon-icon-space"></span>
          <span class="url-title">COMING SOON</span>
        </button>

        <button class="url-button coming-soon-button build-item" type="button">
          <span class="coming-soon-icon-space"></span>
          <span class="url-title">COMING SOON</span>
        </button>

        <button class="url-button coming-soon-button build-item" type="button">
          <span class="coming-soon-icon-space"></span>
          <span class="url-title">COMING SOON</span>
        </button>

      </div>

    </section>

  </main>


  <!-- COMING SOON POPUP -->
  <div id="coming-soon-popup">
    COMING SOON...
  </div>


  <!-- TOP BUTTON -->
  <button id="top-button" type="button" aria-label="ページ上部へ戻る">
    TOP
  </button>


  <script src="js/night-sky.js"></script>
  <script src="js/script.js"></script>

</html>
